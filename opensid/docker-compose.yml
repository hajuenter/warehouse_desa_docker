services:
  app:
    image: hajuenter/opensid:latest
    container_name: opensid_app
    restart: unless-stopped
    ports:
      - "8080:80"
    env_file:
      - .env
    networks:
      - wh_shared

  sender:
    image: hajuenter/sender_opensid:latest
    container_name: opensid_sender
    restart: unless-stopped
    environment:
      DB_HOST: receiver
      DB_PORT: 3306
      DB_USER: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_DATABASE}
      DESA_KODE: ${DESA_KODE}
      WEBHOOK_TOKEN: ${WEBHOOK_TOKEN}
      WEBHOOK_URL: ${WEBHOOK_URL}
      WEBHOOK_TIMEOUT: ${WEBHOOK_TIMEOUT:-10}
      MAX_RETRY: ${MAX_RETRY:-5}
      POLL_INTERVAL: ${POLL_INTERVAL:-3}
    networks:
      - wh_shared

networks:
  wh_shared:
    external: true
